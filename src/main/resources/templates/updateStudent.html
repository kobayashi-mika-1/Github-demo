<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <title>受講生詳細</title>
</head>
<body>
<h1>受講生詳細</h1>
<form th:action="@{/updateStudent}" th:object="${studentDetail}" method="post">
  <div>
    <label for="id">ID：</label>
    <input type="text" id="id" th:field="*{student.id}" required />
  </div>
  <div>
    <label for="fullName">名前：</label>
    <input type="text" id="fullName" th:field="*{student.fullName}" required />
  </div>
  <div>
    <label for="furigana">ふりがな：</label>
    <input type="text" id="furigana" th:field="*{student.furigana}" required />
  </div>
  <div>
    <label for="nicname">ニックネーム：</label>
    <input type="text" id="nicname" th:field="*{student.nicname}" required />
  </div>
  <div>
    <label for="email">メールアドレス：</label>
    <input type="text" id="email" th:field="*{student.email}" required />
  </div>
  <div>
    <label for="address">住所：</label>
    <input type="text" id="address" th:field="*{student.address}" required />
  </div>
  <div>
    <label for="age">年齢：</label>
    <input type="text" id="age" th:field="*{student.age}" required />
  </div>
  <div>
    <label for="gender">性別：</label>
    <input type="text" id="gender" th:field="*{student.gender}" required />
  </div>
  <div>
    <label for="remark">備考：</label>
    <input type="text" id="remark" th:field="*{student.remark}"  />
  </div>
  <div th:each="course, stat : *{studentsCourses}">
    <label for="id"
    th:for="studentsCourses.__${stat.index}__.id">受講コースID：</label>
    <input type="hidden" th:id="studentsCourses.__${stat.index}__.id"
           th:field="*{studentsCourses[__${stat.index}__].id}" />
    <label for="course">受講コース名：</label>
    <input type="text" id="course" th:id="studentsCourses.__${stat.index}__.course" th:field="*{studentsCourses[__${stat.index}__].course}" />
  </div>
  <div>
    <button type="submit">更新</button>
  </div>
</form>
</body>
</html>
